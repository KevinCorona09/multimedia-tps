<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Escaneo Facial 3D Interactivo</title>

  <!-- p5.js y ml5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  <!-- Triangulación rápida (2D) para generar los triángulos una sola vez -->
  <script src="https://unpkg.com/delaunator@5.0.0/delaunator.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <h1>Escaneo Facial 3D con FaceMesh</h1>
    <p class="subtitle">Video + malla 3D al mismo tiempo. Sin opciones: la cámara se inicia automáticamente.</p>

    <div id="status" class="status">Inicializando...</div>

    <div id="canvas-container" class="canvas-wrapper"></div>

    <noscript>
      <p>Este proyecto requiere JavaScript habilitado.</p>
    </noscript>
  </main>

  <script src="sketch.js"></script>
</body>
</html>
