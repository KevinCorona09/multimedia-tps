<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escaneo Facial 3D Interactivo</title>
  
  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
  
  <!-- ml5.js (última versión con FaceMesh) -->
  <script src="https://unpkg.com/ml5@1/dist/ml5.min.js"></script>
  
  <!-- Delaunator para triangulación -->
  <script src="https://cdn.jsdelivr.net/npm/delaunator@5.0.0/delaunator.min.js"></script>
  
  <!-- Estilos -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Escaneo Facial 3D Interactivo</h1>
    <p class="subtitle">
      Detección facial con ml5.js FaceMesh + Visualización 3D con p5.js
    </p>
    <div id="status" class="status">Inicializando...</div>
    <div class="canvas-wrapper">
      <div id="canvas-container"></div>
    </div>
  </div>
  
  <!-- Script principal -->
  <script src="sketch.js"></script>

</html>
